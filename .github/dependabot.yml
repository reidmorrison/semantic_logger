# Keeps the actions that the workflows pin to a commit SHA up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only propose a release once it is at least two weeks old, so that a compromised release is
    # more likely to be found and withdrawn before it is proposed.
    cooldown:
      default-days: 14
