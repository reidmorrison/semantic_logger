name: build

on:
  - push
  - pull_request

# Read-only unless a job asks for more. The jobs install and run third-party gems, which must not
# get a token that can push to the repository.
permissions:
  contents: read

jobs:
  test:
    name: "Test: Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
    env:
      MONGO_HOST: 127.0.0.1:27017
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4, "4.0"]
        # Measure coverage on one MRI version only.
        include:
          - ruby: 3.4
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the token out of .git/config, where every later step could read it.
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Ruby Version
        run: ruby --version
      - name: Run Tests
        if: ${{ !matrix.coverage }}
        run: bundle exec rake
      # A separate step because test_helper.rb enables coverage when COVERAGE is set at all, even to "".
      - name: Run Tests with Coverage
        if: ${{ matrix.coverage }}
        run: bundle exec rake
        env:
          COVERAGE: true
      - name: Keep the coverage summary for the badge
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/.last_run.json
          include-hidden-files: true
          retention-days: 1

  coverage_badge:
    # The only job that can push, so it runs no code from the repository or its gems: it only reads
    # the coverage summary that the test job kept.
    name: "Publish Coverage Badge"
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # To push the coverage badge to the badges branch.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Publish Coverage Badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a shields.io endpoint file from SimpleCov's summary.
          mkdir "$RUNNER_TEMP/badges"
          ruby -rjson -e '
            percent = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            color   = {90 => "brightgreen", 80 => "green", 70 => "yellow", 60 => "orange"}.find { |min, _| percent >= min }&.last || "red"
            badge   = {schemaVersion: 1, label: "coverage", message: format("%.1f%%", percent), color: color}
            File.write(ARGV[0], JSON.generate(badge))
          ' "$RUNNER_TEMP/badges/coverage.json"
          # Replace the badges branch with a single commit so that it never accumulates history.
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  gemspec_only:
    # The test Gemfile pulls in many gems that depend on standard library gems such as logger,
    # which hides a missing runtime dependency. Load the gem with only its gemspec dependencies,
    # and fail on any warning, such as Ruby 3.4 warning that a default gem is becoming bundled.
    name: "Gemspec dependencies only: Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4, "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Load and log with only the gemspec dependencies installed
        run: |
          export BUNDLE_GEMFILE="$RUNNER_TEMP/Gemfile"
          printf 'source "https://rubygems.org"\ngem "semantic_logger", path: "%s"\n' "$GITHUB_WORKSPACE" > "$BUNDLE_GEMFILE"
          bundle install
          script='
            require "semantic_logger"
            SemanticLogger.sync!
            SemanticLogger.add_appender(io: $stdout, formatter: :json)
            SemanticLogger["Check"].info("Loaded with gemspec dependencies only")
          '
          if ! bundle exec ruby -e "$script" 2> "$RUNNER_TEMP/stderr.txt" || [ -s "$RUNNER_TEMP/stderr.txt" ]; then
            cat "$RUNNER_TEMP/stderr.txt"
            exit 1
          fi

  rubocop:
    name: "RuboCop"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --parallel
