# The ClickHouse data source, with the tables that the Collector's exporter creates as its OpenTelemetry
# defaults, so that Grafana's logs and traces views find them.
apiVersion: 1
datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: otel
      defaultDatabase: otel
      logs:
        defaultDatabase: otel
        defaultTable: otel_logs
        otelEnabled: true
    secureJsonData:
      password: otel
