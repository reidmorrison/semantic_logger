{% comment %}
  The Semantic Logger mark, overriding the theme's default RM shield: Jekyll
  searches a site's _includes before the theme's, so dropping this file here is
  the whole of the override.

  Source of truth for the artwork is sl-logo.svg in the business folder. Two
  things about it are load-bearing here and must survive any re-export:

    - It is INLINE SVG, not an <img>. Both fills read --logo-ink and
      --logo-accent, which is how one file serves the light and dark themes;
      an externally referenced SVG cannot see the page's CSS.
    - aria-hidden, because the adjacent project name already names the link.
      The mark is decoration in this position, not content.
{% endcomment %}
